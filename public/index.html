<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard</title>
<script src="/socket.io/socket.io.js"></script>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
}

.scoreboard {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.teams {
  display: flex;
  gap: 60px;
  text-align: center;
}

.name {
  font-size: 32px;
  font-weight: bold;
}

.score {
  font-size: 110px;
  font-weight: bold;
}

.time {
  font-size: 70px;
  font-weight: bold;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="scoreboard">

  <div class="teams">
    <div>
      <div class="name">GAZDE</div>
      <div id="home" class="score">0</div>
    </div>

    <div>
      <div class="name">OASPEȚI</div>
      <div id="away" class="score">0</div>
    </div>
  </div>

  <div id="time" class="time">00:00</div>
